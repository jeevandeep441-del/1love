<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini Project</title>
    <style>
        /* ================= GLOBAL STYLES ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background image same for all pages */
            background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Har page ek container mein hoga */
        .page {
            display: none; /* Shuru mein sab chhupe honge */
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Jo page active hoga wo dikhega */
        .page.active {
            display: flex;
        }

        /* Glassmorphism Container Box */
        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        /* Buttons */
        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            width: 100%;
            margin-top: 15px;
        }

        button:hover { background: rgba(255, 255, 255, 0.4); }
        button:active { transform: scale(0.90); }

        /* ================= PAGE 1 (Welcome) ================= */
        .welcome-text {
            font-size: 2.5rem;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.5);
        }

        /* ================= PAGE 2 (Quiz) ================= */
        .progress { font-size: 0.9rem; color: #ddd; margin-bottom: 15px; }
        h2 { font-size: 1.3rem; margin-bottom: 20px; line-height: 1.4; }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .correct { background: rgba(0, 255, 0, 0.4) !important; border-color: #00ff00 !important; }
        .wrong { background: rgba(255, 0, 0, 0.4) !important; border-color: #ff0000 !important; }

        /* ================= PAGE 3 (Password) ================= */
        .lock-icon { font-size: 3rem; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            outline: none;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .error-msg { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: bold; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        .shake { animation: shake 0.4s ease-in-out; }
        .hide { display: none !important; }

        /* ================= PAGE 4 (Photos) ================= */
        .collage-container {
            width: 100%;
            height: 100%;
            position: relative;
            max-width: 450px;
        }
        .photo-box {
            position: absolute;
            background: #f5f5f5;
            padding: 8px 8px 25px 8px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.6);
            opacity: 0;
            border-radius: 2px;
        }
        .photo-box .img-container { width: 100%; height: 100%; overflow: hidden; background: #000; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .box-1 { top: 10%; left: 6%; width: 65%; height: 30%; --final-rotation: -5deg; }
        .box-2 { bottom: 12%; left: 6%; width: 60%; height: 32%; --final-rotation: 4deg; }
        .box-3 { top: 32%; right: 6%; width: 70%; height: 36%; --final-rotation: -8deg; }

        @keyframes dropIn {
            0% { opacity: 0; top: -60%; transform: scale(1.1) rotate(calc(var(--final-rotation) - 15deg)); }
            60% { opacity: 1; top: 8%; transform: scale(1) rotate(var(--final-rotation)); }
            100% { opacity: 1; transform: scale(1) rotate(var(--final-rotation)); }
        }
        .animate-1 { animation: dropIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 3; }
        .animate-2 { animation: dropIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.6s; z-index: 2; }
        .animate-3 { animation: dropIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 1.2s; z-index: 4; }
    </style>
</head>
<body>

    <!-- ================= PAGE 1: WELCOME ================= -->
    <div id="page1" class="page active">
        <div class="glass-box">
            <h1 class="welcome-text">Welcome</h1>
            <button onclick="nextPage(2)">Next</button>
        </div>
    </div>

    <!-- ================= PAGE 2: QUIZ ================= -->
    <div id="page2" class="page">
        <div class="glass-box">
            <div class="progress" id="progressText">Puzzle 1 of 5</div>
            <h2 id="questionText">Loading...</h2>
            <div id="optionsContainer"></div>
        </div>
    </div>

    <!-- ================= PAGE 3: PASSWORD ================= -->
    <div id="page3" class="page">
        <div class="glass-box" id="lockBox">
            <div class="lock-icon" id="lockIcon">🔒</div>
            <h1>Enter Password</h1>
            <p>Solve the puzzles to find the code.</p>
            <input type="text" id="passwordInput" placeholder="Enter code..." autocomplete="off">
            <button onclick="checkPassword()">Unlock</button>
            <div class="error-msg" id="errorMsg">❌ Galat Password!</div>
            <button id="nextToPage4Btn" class="hide" onclick="nextPage(4)">Next Page ➔</button>
        </div>
    </div>

    <!-- ================= PAGE 4: PHOTOS ================= -->
    <div id="page4" class="page">
        <div class="collage-container">
            
            <!-- Photo 1 -->
            <div class="photo-box box-1" id="box1">
                <div class="img-container">
                    <img src="photo1.jpg" alt="Photo 1">
                </div>
            </div>

            <!-- Photo 2 -->
            <div class="photo-box box-2" id="box2">
                <div class="img-container">
                    <img src="photo2.jpg" alt="Photo 2">
                </div>
            </div>

            <!-- Photo 3 -->
            <div class="photo-box box-3" id="box3">
                <div class="img-container">
                    <img src="photo3.jpg" alt="Photo 3">
                </div>
            </div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // -----------------------------------------
        // PAGE NAVIGATION LOGIC
        // -----------------------------------------
        function nextPage(pageNum) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNum).classList.add('active');

            if (pageNum === 2) {
                loadQuestion();
            }
            if (pageNum === 4) {
                triggerPhotoAnimations();
            }
        }

        // -----------------------------------------
        // PAGE 2: QUIZ LOGIC
        // -----------------------------------------
        const quizData = [
            { question: "Earth par 36N wazan, Moon par kitna?", options: ["12 N", "6 N", "36 N", "0 N"], answer: "6 N" },
            { question: "Series: B, E, H, K, N, ?", options: ["P", "Q", "R", "S"], answer: "Q" },
            { question: "Heptagon mein kitni sides hoti hain?", options: ["5", "6", "7", "8"], answer: "7" },
            { question: "E = mc² mein Speed of Light kaunsa letter hai?", options: ["E", "M", "C", "G"], answer: "C" },
            { question: "Mid-point (4, 5) ke liye y ka maan?", options: ["4", "5", "6", "7"], answer: "6" }
        ];

        let currentQIndex = 0;

        function loadQuestion() {
            const data = quizData[currentQIndex];
            document.getElementById('progressText').innerText = `Puzzle ${currentQIndex + 1} of 5`;
            document.getElementById('questionText').innerText = data.question;
            
            const optionsDiv = document.getElementById('optionsContainer');
            optionsDiv.innerHTML = "";

            data.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, data.answer);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, correctAnswer) {
            if (selectedBtn.innerText === correctAnswer) {
                selectedBtn.classList.add('correct');
                setTimeout(() => {
                    currentQIndex++;
                    if (currentQIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        nextPage(3); 
                    }
                }, 600);
            } else {
                selectedBtn.classList.add('wrong');
                setTimeout(() => { selectedBtn.classList.remove('wrong'); }, 600);
            }
        }

        // -----------------------------------------
        // PAGE 3: PASSWORD LOGIC
        // -----------------------------------------
        const CORRECT_PASSWORD = "6Q7C6";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            const lockBox = document.getElementById('lockBox');
            const lockIcon = document.getElementById('lockIcon');
            const inputField = document.getElementById('passwordInput');
            const unlockBtn = document.querySelector('#page3 button');

            if (input === CORRECT_PASSWORD) {
                errorMsg.style.display = 'none';
                lockIcon.innerText = '🔓';
                
                inputField.classList.add('hide');
                unlockBtn.classList.add('hide');
                
                document.getElementById('nextToPage4Btn').classList.remove('hide');

            } else {
                errorMsg.style.display = 'block';
                lockBox.classList.add('shake');
                inputField.value = '';
                setTimeout(() => { lockBox.classList.remove('shake'); }, 400);
            }
        }

        // -----------------------------------------
        // PAGE 4: ANIMATION LOGIC
        // -----------------------------------------
        function triggerPhotoAnimations() {
            document.getElementById('box1').className = 'photo-box box-1';
            document.getElementById('box2').className = 'photo-box box-2';
            document.getElementById('box3').className = 'photo-box box-3';

            setTimeout(() => { document.getElementById('box1').classList.add('animate-1'); }, 200);
            setTimeout(() => { document.getElementById('box2').classList.add('animate-2'); }, 700);
            setTimeout(() => { document.getElementById('box3').classList.add('animate-3'); }, 1400);
        }
    </script>
</body>
  </html>
