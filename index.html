
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini Project</title>
    <style>
        /* ================= GLOBAL STYLES ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Text copy aur highlight rokne ke liye */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            width: 100%;
            margin-top: 15px;
        }

        button:hover { background: rgba(255, 255, 255, 0.4); }
        button:active { transform: scale(0.90); }

        /* ================= PAGE 1 ================= */
        .welcome-text { font-size: 2.5rem; text-shadow: 0px 2px 10px rgba(0,0,0,0.5); }

        /* ================= PAGE 2 ================= */
        .progress { font-size: 0.9rem; color: #ddd; margin-bottom: 15px; }
        h2 { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.4; }
        
        #quizInput {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            outline: none;
            font-weight: 600;
            margin-top: 10px;
        }
        #quizInput::placeholder { color: #ccc; font-weight: normal; }

        .feedback { font-size: 1rem; font-weight: bold; margin-top: 10px; height: 20px; }
        .feedback.correct { color: #00ff00; }
        .feedback.wrong { color: #ff4d4d; }

        /* ================= PAGE 3 ================= */
        .lock-icon { font-size: 3rem; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            outline: none;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .error-msg { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: bold; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        .shake { animation: shake 0.4s ease-in-out; }
        .hide { display: none !important; }

        /* ================= PAGE 4 ================= */
        .collage-container {
            width: 100%;
            height: 100%;
            position: relative;
            max-width: 450px;
        }
        .photo-box {
            position: absolute;
            background: #f5f5f5;
            padding: 8px 8px 25px 8px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.6);
            opacity: 0;
            border-radius: 2px;
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .photo-box .img-container { width: 100%; height: 100%; overflow: hidden; background: #000; }
        .photo-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            pointer-events: none; 
            -webkit-user-drag: none;
        }

        .box-1 { top: 10%; left: 6%; width: 65%; height: 30%; --final-rotation: -5deg; }
        .box-2 { bottom: 12%; left: 6%; width: 60%; height: 32%; --final-rotation: 4deg; }
        .box-3 { top: 32%; right: 6%; width: 70%; height: 36%; --final-rotation: -8deg; }

        @keyframes dropIn {
            0% { opacity: 0; top: -60%; transform: scale(1.1) rotate(calc(var(--final-rotation) - 15deg)); }
            60% { opacity: 1; top: 8%; transform: scale(1) rotate(var(--final-rotation)); }
            100% { opacity: 1; transform: scale(1) rotate(var(--final-rotation)); }
        }
        .animate-1 { animation: dropIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 3; }
        .animate-2 { animation: dropIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.6s; z-index: 2; }
        .animate-3 { animation: dropIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 1.2s; z-index: 4; }

        /* 🔥 ZOOM OVERLAY */
        .zoom-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .zoom-overlay.active {
            display: flex;
            opacity: 1;
        }

        .zoom-overlay img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            pointer-events: none; 
        }

        .zoom-overlay.active img {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 1001;
            pointer-events: auto; 
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.4); }

        /* Warning Text */
        .warning-text {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <!-- ================= PAGE 1 (Welcome) ================= -->
    <div id="page1" class="page active">
        <div class="glass-box">
            <h1 class="welcome-text">Welcome</h1>
            <button onclick="nextPage(2)">Next</button>
        </div>
    </div>

    <!-- ================= PAGE 2 (Quiz) ================= -->
    <div id="page2" class="page">
        <div class="glass-box">
            <div class="progress" id="progressText">Puzzle 1 of 5</div>
            <h2 id="questionText">Loading...</h2>
            <input type="text" id="quizInput" placeholder="Type your answer here..." autocomplete="off">
            <button onclick="checkQuizAnswer()">Submit</button>
            <div class="feedback" id="quizFeedback"></div>
        </div>
    </div>

    <!-- ================= PAGE 3 (Password) ================= -->
    <div id="page3" class="page">
        <div class="glass-box" id="lockBox">
            <div class="lock-icon" id="lockIcon">🔒</div>
            <h1>Enter Password</h1>
            <p>Solve the puzzles to find the code.</p>
            <input type="text" id="passwordInput" placeholder="Enter code..." autocomplete="off">
            <button onclick="checkPassword()">Unlock</button>
            <div class="error-msg" id="errorMsg">❌ Galat Password!</div>
            <button id="nextToPage4Btn" class="hide" onclick="nextPage(4)">Next Page ➔</button>
        </div>
    </div>

    <!-- ================= PAGE 4 (Photos) ================= -->
    <div id="page4" class="page">
        <div class="collage-container">
            
            <div class="photo-box box-1" id="box1" onclick="openZoom('photo1.jpg')">
                <div class="img-container">
                    <img src="photo1.jpg" alt="Photo 1" oncontextmenu="return false;">
                </div>
            </div>

            <div class="photo-box box-2" id="box2" onclick="openZoom('photo2.jpg')">
                <div class="img-container">
                    <img src="photo2.jpg" alt="Photo 2" oncontextmenu="return false;">
                </div>
            </div>

            <div class="photo-box box-3" id="box3" onclick="openZoom('photo3.jpg')">
                <div class="img-container">
                    <img src="photo3.jpg" alt="Photo 3" oncontextmenu="return false;">
                </div>
            </div>

        </div>
        <div class="warning-text">⚠️ Screenshot or Download is prohibited</div>
    </div>

    <!-- 🔥 ZOOM OVERLAY -->
    <div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
        <button class="close-btn" onclick="closeZoom()">✖</button>
        <img id="zoomedImage" src="" alt="Zoomed Photo" oncontextmenu="return false;">
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // PAGE NAVIGATION
        function nextPage(pageNum) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNum).classList.add('active');

            if (pageNum === 2) loadQuestion();
            if (pageNum === 4) triggerPhotoAnimations();
        }

        // QUIZ LOGIC
        const quizData = [
            { question: "Einstein ki equation E = mc² mein, kaunsa letter Speed of Light ko darshata hai?", answer: "C" },
            { question: "Is series ka agla letter kya hoga? B, E, H, K, N, ?", answer: "Q" },
            { question: "Agar kisi object ka wazan Earth par 36 N hai, to Moon par uska wazan kitne Newton hoga?", answer: "6" },
            { question: "Heptagon (saptbhuj) mein kitni sides (bhujaayein) hoti hain?", answer: "7" },
            { question: "Agar points (2, 4) aur (6, y) ka mid-point (4, 5) hai, to y ka maan kya hoga?", answer: "6" }
        ];

        let currentQIndex = 0;

        function loadQuestion() {
            const data = quizData[currentQIndex];
            document.getElementById('progressText').innerText = `Puzzle ${currentQIndex + 1} of 5`;
            document.getElementById('questionText').innerText = data.question;
            document.getElementById('quizInput').value = "";
            document.getElementById('quizFeedback').innerText = "";
            document.getElementById('quizFeedback').className = "feedback";
        }

        function checkQuizAnswer() {
            const inputField = document.getElementById('quizInput');
            const userAnswer = inputField.value.trim().toUpperCase();
            const feedback = document.getElementById('quizFeedback');
            const correctAnswer = quizData[currentQIndex].answer.toUpperCase();

            if (userAnswer === correctAnswer) {
                feedback.innerText = "✅ Correct!";
                feedback.className = "feedback correct";
                inputField.disabled = true; 

                setTimeout(() => {
                    inputField.disabled = false;
                    currentQIndex++;
                    if (currentQIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        nextPage(3); 
                    }
                }, 1000); 
            } else {
                feedback.innerText = "❌ Wrong Answer, Try again!";
                feedback.className = "feedback wrong";
                inputField.value = "";
            }
        }

        document.getElementById('quizInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkQuizAnswer();
            }
        });

        // PASSWORD LOGIC
        const CORRECT_PASSWORD = "6Q7C6";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMsg');
            const lockBox = document.getElementById('lockBox');
            const lockIcon = document.getElementById('lockIcon');
            const inputField = document.getElementById('passwordInput');
            const unlockBtn = document.querySelector('#page3 button');

            if (input === CORRECT_PASSWORD) {
                errorMsg.style.display = 'none';
                lockIcon.innerText = '🔓';
                inputField.classList.add('hide');
                unlockBtn.classList.add('hide');
                document.getElementById('nextToPage4Btn').classList.remove('hide');
            } else {
                errorMsg.style.display = 'block';
                lockBox.classList.add('shake');
                inputField.value = '';
                setTimeout(() => { lockBox.classList.remove('shake'); }, 400);
            }
        }

        // PHOTO ANIMATIONS
        function triggerPhotoAnimations() {
            document.getElementById('box1').className = 'photo-box box-1';
            document.getElementById('box2').className = 'photo-box box-2';
            document.getElementById('box3').className = 'photo-box box-3';

            setTimeout(() => { document.getElementById('box1').classList.add('animate-1'); }, 200);
            setTimeout(() => { document.getElementById('box2').classList.add('animate-2'); }, 700);
            setTimeout(() => { document.getElementById('box3').classList.add('animate-3'); }, 1400);
        }

        // 🔥 ZOOM LOGIC
        function openZoom(imageSrc) {
            const overlay = document.getElementById('zoomOverlay');
            const zoomedImg = document.getElementById('zoomedImage');
            zoomedImg.src = imageSrc;
            overlay.classList.add('active');
        }

        function closeZoom() {
            const overlay = document.getElementById('zoomOverlay');
            overlay.classList.remove('active');
        }

        // 🔥 LONG PRESS / RIGHT CLICK BAND (Global block)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
